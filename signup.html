<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – RoomKaroo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="container">
    <div class="auth-card">

        <!-- Logo -->
        <div class="text-center mb-4">
            <a href="index.html" class="rq-logo" style="font-size: 1.8rem;">Roomi<span>Q</span></a>
        </div>

        <div class="auth-title">Create your account</div>
        <p class="auth-sub">Join RoomKaroo — it's completely free</p>

        <!-- Role selector -->
        <p style="font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 10px;">I want to:</p>
        <div class="role-selector">
            <div class="role-option active" id="role-finder" onclick="selectRole('finder')">
                <span class="role-icon">🔍</span>
                <div class="role-name">Find a Hostel</div>
                <div class="role-desc">I'm a student looking for accommodation</div>
            </div>
            <div class="role-option" id="role-lister" onclick="selectRole('lister')">
                <span class="role-icon">🏠</span>
                <div class="role-name">List My Property</div>
                <div class="role-desc">I own a hostel or room to rent</div>
            </div>
        </div>

        <!-- Form -->
        <form>
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label-rq">First Name</label>
                    <input type="text" class="form-control-rq" placeholder="Ali">
                </div>
                <div class="col-6">
                    <label class="form-label-rq">Last Name</label>
                    <input type="text" class="form-control-rq" placeholder="Khan">
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label-rq">Email Address</label>
                <input type="email" class="form-control-rq" placeholder="e.g. student@pucit.edu.pk">
            </div>

            <div class="mt-3">
                <label class="form-label-rq">Phone Number</label>
                <div style="display: flex; gap: 8px;">
                    <span style="background: var(--bg-light); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">+92</span>
                    <input type="tel" class="form-control-rq" placeholder="300 1234567" style="flex: 1;">
                </div>
            </div>

            <!-- Lister-only field (shown conditionally) -->
            <div class="mt-3" id="hostelNameField" style="display: none;">
                <label class="form-label-rq">Hostel / Property Name</label>
                <input type="text" class="form-control-rq" placeholder="e.g. Al-Noor Boys Hostel">
            </div>

            <div class="mt-3">
                <label class="form-label-rq">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control-rq" placeholder="Minimum 8 characters" id="newPassword" style="padding-right: 42px;">
                    <button type="button" onclick="togglePass()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="mt-3 mb-4">
                <label class="form-label-rq">Confirm Password</label>
                <input type="password" class="form-control-rq" placeholder="Repeat your password">
            </div>

            <!-- Terms -->
            <div class="d-flex align-items-start gap-2 mb-4">
                <input type="checkbox" id="terms" style="margin-top: 3px; accent-color: var(--primary);">
                <label for="terms" style="font-size: 0.82rem; color: var(--text-muted);">
                    I agree to the <a href="#" style="color: var(--primary); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary); text-decoration: none;">Privacy Policy</a>
                </label>
            </div>

            <a href="lister-dashboard.html" class="btn-primary-rq w-100 text-center" style="display: block; padding: 13px;" id="signupBtn">
                Create Account
            </a>
        </form>

        <div class="text-center mt-4" style="font-size: 0.88rem; color: var(--text-muted);">
            Already have an account?
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log In</a>
        </div>

        <div class="text-center mt-2">
            <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentRole = 'finder';

    function selectRole(role) {
        currentRole = role;
        document.querySelectorAll('.role-option').forEach(r => r.classList.remove('active'));
        document.getElementById('role-' + role).classList.add('active');

        const hostelField = document.getElementById('hostelNameField');
        const btn = document.getElementById('signupBtn');

        if (role === 'lister') {
            hostelField.style.display = 'block';
            btn.href = 'lister-dashboard.html';
        } else {
            hostelField.style.display = 'none';
            btn.href = 'finder-home.html';
        }
    }

    function togglePass() {
        const input = document.getElementById('newPassword');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
