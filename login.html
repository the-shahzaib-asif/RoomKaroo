<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – RoomKaroo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="container">
    <div class="auth-card">

        <!-- Logo -->
        <div class="text-center mb-4">
            <a href="index.html" class="rq-logo" style="font-size: 1.8rem;">Room<span>Karoo</span></a>
        </div>

        <div class="auth-title">Welcome back 👋</div>
        <p class="auth-sub">Log in to access your RoomKaroo account</p>

        <!-- Role selector -->
        <div class="role-selector">
            <div class="role-option active" onclick="selectRole(this)">
                <span class="role-icon">🔍</span>
                <div class="role-name">Finder</div>
                <div class="role-desc">Looking for a hostel</div>
            </div>
            <div class="role-option" onclick="selectRole(this)">
                <span class="role-icon">🏠</span>
                <div class="role-name">Lister</div>
                <div class="role-desc">I own a hostel</div>
            </div>
        </div>

        <!-- Form -->
        <form>
            <div class="mb-3">
                <label class="form-label-rq">Email Address</label>
                <input type="email" class="form-control-rq" placeholder="e.g. student@pucit.edu.pk">
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label-rq">Password</label>
                    <a href="#" style="font-size: 0.82rem; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot password?</a>
                </div>
                <div style="position: relative;">
                    <input type="password" class="form-control-rq" placeholder="Enter your password" id="passwordInput" style="padding-right: 42px;">
                    <button type="button" onclick="togglePass()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <a href="finder-home.html" class="btn-primary-rq w-100 text-center" style="display: block; padding: 13px;">
                Log In
            </a>
        </form>

        <div class="text-center mt-4" style="font-size: 0.88rem; color: var(--text-muted);">
            Don't have an account?
            <a href="signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up Free</a>
        </div>

        <div class="text-center mt-2">
            <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function selectRole(el) {
        document.querySelectorAll('.role-option').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
    }

    function togglePass() {
        const input = document.getElementById('passwordInput');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
